uvdesk_mailbox:
    emails: ~

    mailboxes:
        gmail:
            name: 'Gmail Reception'
            enabled: true
            disable_outbound_emails: false
            use_strict_mode: false

            imap_server:
                host: 'imap.gmail.com'
                username: 'ewenbruce82@gmail.com'
                password: '%env(string:GMAIL_PASSWORD)%'

            smtp_server:
                host: 'smtp.gmail.com'
                port: 587
                client: 'tls'
                type: 'smtp'
                username: 'ewenbruce82@gmail.com'
                password: '%env(string:GMAIL_PASSWORD)%'
                sender_address: 'ewenbruce82@gmail.com'


